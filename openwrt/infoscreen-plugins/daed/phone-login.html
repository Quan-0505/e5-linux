<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="referrer" content="no-referrer"><title>DAED 设备登录</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 18px;font:16px system-ui,"Noto Sans CJK SC",sans-serif;background:#f5f7fa;color:#17212b}.card{max-width:440px;margin:8vh auto;padding:24px;border:1px solid #dce2e8;border-radius:18px;background:white;box-shadow:0 12px 40px #17212b12}h1{margin:0 0 8px;font-size:24px}.muted{color:#627181;line-height:1.5}label{display:block;margin:18px 0 6px;font-weight:650}input{width:100%;height:48px;padding:10px 12px;border:1px solid #bac5d0;border-radius:10px;font:inherit}button{width:100%;height:48px;margin-top:22px;border:0;border-radius:10px;background:#187f68;color:white;font:inherit;font-weight:700}button:disabled{opacity:.6}#result{min-height:24px;margin-top:14px;color:#344454}.error{color:#b42318!important}
</style></head><body><main class="card"><h1>DAED 设备登录</h1><p class="muted">仅向当前 E5 设备提交账号和密码。成功后设备会保存 30 天登录令牌，密码不会保存。</p><form id="form"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required maxlength="128"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit" type="submit">登录并授权此设备</button></form><p id="result" role="status"></p></main><script>
const form=document.querySelector('#form'),result=document.querySelector('#result'),submit=document.querySelector('#submit');
form.addEventListener('submit',async e=>{e.preventDefault();const code=location.hash.slice(1);if(!/^[a-f0-9]{48}$/.test(code)){result.textContent='二维码无效或已过期，请在设备屏幕刷新后重试。';result.className='error';return}submit.disabled=true;result.className='';result.textContent='正在安全登录…';try{const r=await fetch('/cgi-bin/e5-daed-pair',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({code,username:form.username.value,password:form.password.value})});const data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||'登录失败');form.reset();history.replaceState(null,'',location.pathname);result.textContent='登录成功，可以返回 E5 屏幕更新订阅。'}catch(err){result.textContent=err.message||'登录失败，请重试';result.className='error'}finally{submit.disabled=false}});
</script></body></html>
