<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>代理开关</title>
  <link rel="stylesheet" href="daed.css">
  <script src="/sdk/e5.js"></script>
  <script defer src="daed.js"></script>
</head>
<body>
  <header>
    <div class="title">代理开关</div>
    <button class="back" id="exit" type="button">返回</button>
  </header>
  <main>
    <section class="status" aria-live="polite">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">正在读取状态…</span>
      <button class="refresh" id="refresh" type="button" aria-label="刷新状态">刷新</button>
    </section>
    <section class="controls" aria-label="代理控制">
      <button class="control start" data-action="start" type="button"><span class="symbol">▶</span><span>启动</span></button>
      <button class="control stop" data-action="stop" type="button"><span class="symbol">■</span><span>停止</span></button>
      <button class="control reload" data-action="reload" type="button"><span class="symbol">↻</span><span>重载</span></button>
      <button class="control subscriptions" data-action="subscriptions" type="button"><span class="symbol">⇩</span><span>更新订阅</span></button>
    </section>
    <p id="message" class="message" aria-live="assertive">选择要执行的操作。</p>
    <p class="hint">停止和重载会影响当前代理连接。</p>
  </main>
</body>
</html>
