<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>DAED 代理</title>
  <link rel="stylesheet" href="daed.css">
  <script src="/sdk/e5.js"></script>
  <script defer src="daed.js"></script>
</head>
<body>
  <main>
    <section id="controls-view">
      <section class="status-card" aria-live="polite">
        <div class="service-name"><span class="globe">◎</span><strong>DAED</strong></div>
        <span class="status-pill"><span class="dot" id="status-dot"></span><span id="status-text">正在读取…</span></span>
      </section>
      <section class="traffic-card" aria-label="实时流量">
        <div class="traffic-heading"><strong>流量</strong><span id="interface-name">整机 · sipa_eth0</span></div>
        <div class="traffic-grid">
          <article class="traffic-metric download">
            <div class="metric-title"><span>↓ 下行</span><button class="rate-value" id="download-rate" data-rate-toggle type="button" aria-label="点按切换上下行速率单位">—</button></div>
            <svg class="sparkline" viewBox="0 0 100 24" preserveAspectRatio="none" aria-label="下行速度曲线"><polyline id="download-line" points=""></polyline></svg>
            <small>累计 <span id="download-total">—</span></small>
          </article>
          <article class="traffic-metric upload">
            <div class="metric-title"><span>↑ 上行</span><button class="rate-value" id="upload-rate" data-rate-toggle type="button" aria-label="点按切换上下行速率单位">—</button></div>
            <svg class="sparkline" viewBox="0 0 100 24" preserveAspectRatio="none" aria-label="上行速度曲线"><polyline id="upload-line" points=""></polyline></svg>
            <small>累计 <span id="upload-total">—</span></small>
          </article>
        </div>
        <p id="traffic-note" class="traffic-note" hidden></p>
      </section>
      <section class="action-card" aria-label="DAED控制">
        <button class="primary-action stop" id="toggle-daed" data-action="toggle" type="button"><span class="symbol">■</span><span id="toggle-label">停止代理</span></button>
        <div class="secondary-actions">
          <button class="secondary-action" data-action="reload" type="button">重载配置</button>
          <button class="secondary-action" data-action="subscriptions" type="button">更新订阅</button>
        </div>
      </section>
      <p id="message" class="message" aria-live="assertive" hidden>选择要执行的操作。</p>
    </section>
    <section id="subscriptions-view" class="sub-view" hidden aria-label="选择订阅">
      <div class="view-heading"><strong>选择要更新的订阅</strong><button class="small-button" id="logout" type="button">退出登录</button></div>
      <div id="pairing" class="pairing" hidden>
        <p>手机连接 E5 Wi-Fi 后扫码登录 DAED</p><div id="qr-code" class="qr-code" aria-label="登录二维码"></div>
        <p id="pair-message" class="message">二维码有效期 5 分钟</p><button class="small-button" id="new-qr" type="button">刷新二维码</button>
      </div>
      <div id="subscription-list" class="subscription-list" data-nav-grid></div>
      <p id="subscription-message" class="message" aria-live="assertive">选择一个订阅开始更新。</p>
      <button class="small-button" data-close-view type="button">返回</button>
    </section>
  </main>
</body>
</html>
