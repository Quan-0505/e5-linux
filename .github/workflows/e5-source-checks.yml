name: E5 source checks

on:
  push:
    branches: ['codex/e5-internal-kdae']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install regression tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc pkg-config libglib2.0-dev busybox e2fsprogs zstd
      - name: Validate pinned layout and shell entrypoints
        run: |
          python3 tools/device-layout.py check --system openwrt --model e5
          python3 tools/tests/device-layout.py
          python3 tools/tests/e5-compat-stage.py
          python3 tools/prepare-screen-compat.py
          bash -n boot/init tools/build-e5-kernel.sh openwrt/build-modemmanager.sh openwrt/build-rootfs.sh openwrt/make-flash-bundle.sh magisk/build.sh
      - name: Check installation, packaging and source gates
        run: |
          mkdir -p "$RUNNER_TEMP/e5-test-kernel/drivers/unisoc_platform/thermal"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/sprd-linux-devs/linux/020b970e351eee3887e6caaf2d653926e7086e44/drivers/unisoc_platform/thermal/sprd_soc_thm.c -o "$RUNNER_TEMP/e5-test-kernel/drivers/unisoc_platform/thermal/sprd_soc_thm.c"
          echo "b0051b8d46cdb19608ac92de4a1dcca62e31b4f08240357f8098a8ea616bc86d  $RUNNER_TEMP/e5-test-kernel/drivers/unisoc_platform/thermal/sprd_soc_thm.c" | sha256sum --check
          E5_TEST_KERNEL="$RUNNER_TEMP/e5-test-kernel" python3 devices/test_upstream_20261014.py
          python3 tools/tests/openwrt-package-state.py
          python3 tools/tests/ci-release.py
          python3 openwrt/tests/install-entrypoints.py
          python3 openwrt/tests/hybrid-package.py
          python3 openwrt/tests/flash-diagnostics.py
          python3 tools/tests/android-bootchain.py
          python3 boot/tests/part-update.py
          python3 tools/tests/modem-patch-stack.py --real-source --run-c-tests
