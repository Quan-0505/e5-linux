name: Build and publish OpenWrt
run-name: OpenWrt ${{ inputs.openwrt_version || '25.12.6' }} 路 ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt release
        default: '25.12.6'
        required: true
      source_ref:
        description: e5-linux branch, tag or commit
        default: main
        required: true
      kernel_ref:
        description: linux-lts-e5 branch, tag or commit
        default: e5-6.18
        required: true
      publish:
        description: Publish a GitHub Release after validation
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flash-release-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: CST-8
  E5_SOURCE_REPOSITORY: Quan-0505/e5-linux
  E5_WRT_VER: ${{ inputs.openwrt_version || '25.12.6' }}

jobs:
  block-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || vars.E5_SOURCE_REF || 'main' }}
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: out/openwrt/block-mount-guarded.apk*
          key: guarded-block-native-${{ env.E5_WRT_VER }}-${{ hashFiles('openwrt/build-block-mount*.sh', 'openwrt/block-mount.Dockerfile', 'openwrt/block-probe-guard.h', 'openwrt/patches/fstools-probe-device-types.patch') }}
      - name: Build guarded block package using native x86 SDK
        run: sh openwrt/build-block-mount.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-block-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/openwrt/block-mount-guarded.apk*
          if-no-files-found: error
  wifi-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || vars.E5_SOURCE_REF || 'main' }}
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: wifi-cache
        with:
          path: work/wifi-sae
          key: wifi-sae-native-${{ env.E5_WRT_VER }}-${{ hashFiles('openwrt/build-hostapd*.sh', 'openwrt/hostapd.Dockerfile', 'openwrt/patch-hostapd-sae.py', 'openwrt/hostapd-unisoc*', 'openwrt/wifi-sae-state.py') }}
      # Seed new branches from this completed native build. build-hostapd.sh
      # still checks all current source hashes and APK checksums; stale inputs
      # rebuild normally. Artifact expiry/unavailability also falls back to build.
      - name: Seed verified native Wi-Fi packages on a cache miss
        if: steps.wifi-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: Quan-0505/e5-linux
          run-id: 38924909684
          name: wifi-sae-38924909684-1
          path: work/wifi-sae
      - name: Build matching Wi-Fi SAE packages using native x86 tools
        env:
          UNISOC_WRT_VER: ${{ env.E5_WRT_VER }}
        run: sh openwrt/build-hostapd.sh
      - name: Verify Wi-Fi SAE package hashes and source build ID
        run: python3 openwrt/wifi-sae-state.py work/wifi-sae
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wifi-sae-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/wifi-sae/*.apk
            work/wifi-sae/build-id
            work/wifi-sae/SHA256SUMS
            work/wifi-sae/source-info
          if-no-files-found: error
  rust-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: e5-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Quan-0505/e5-linux
          ref: ${{ inputs.source_ref || vars.E5_SOURCE_REF || 'main' }}
          path: e5-linux
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Quan-0505/rust-daed
          ref: dfee5ebe876fe2e313c2eb49e98b6e8d85d7f7cb
          path: e5-linux/rust-daed
          persist-credentials: false
      - name: Verify pinned Rust source
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('openwrt/network-addons/lock.json').read_text())
          actual=subprocess.check_output(['git','-C','rust-daed','rev-parse','HEAD'],text=True).strip()
          assert actual == lock['rust_daed_revision'], (actual, lock['rust_daed_revision'])
          PY
      - name: Install Rust release dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang llvm libclang-dev libelf-dev cmake libssl-dev perl pkg-config gcc-aarch64-linux-gnu g++-aarch64-linux-gnu dpkg-dev curl file zstd
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
          components: rust-src
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Keep stable as the top-level compiler
        run: rustup default stable
      - name: Install pinned BPF linker release
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bpf-linker-v0.12.0.tar.zst"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.12.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          echo "6789717c8cb6a2a5d920f3b6bfac2bd7efc00f6228ecd149108a99699a75c679  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bpf-linker"
          tar --zstd --extract --file "$archive" --directory "$RUNNER_TEMP/bpf-linker"
          linker="$(find "$RUNNER_TEMP/bpf-linker" -type f -name bpf-linker -print -quit)"
          test -n "$linker"
          install -m 0755 "$linker" "$HOME/.cargo/bin/bpf-linker"
          bpf-linker --version
      - name: Build Rust daemon and verify the public ARM64 payload
        run: |
          RUST_RELEASE_CACHE="$RUNNER_TEMP/rust-cache" bash rust-daed/scripts/build-release.sh "$RUNNER_TEMP/rust-daed-release"
          python3 - <<'PY'
          import hashlib, json, pathlib, tarfile
          from pathlib import Path
          out=Path(__import__('os').environ['RUNNER_TEMP'])/'rust-daed-release'
          work=Path('work/network-addons'); work.mkdir(parents=True,exist_ok=True)
          with tarfile.open(out/'assets/rust-daed-r2s.apk','r:gz') as package:
              members={m.name.removeprefix('./'):m for m in package.getmembers()}
              for name in ['usr/bin/daed','usr/share/daed/geoip.dat','usr/share/daed/geosite.dat','usr/share/daed/web/index.html']:
                  assert name in members and members[name].isfile(), name
              binary=package.extractfile(members['usr/bin/daed']).read()
              assert binary[:5] == b'\x7fELF\x02' and int.from_bytes(binary[18:20],'little')==183
              assert b'version=v3.2.2' in binary
              (work/'daed').write_bytes(binary)
              for name in ['geoip.dat','geosite.dat']:
                  (work/name).write_bytes(package.extractfile(members['usr/share/daed/'+name]).read())
              web=work/'web'; web.mkdir(exist_ok=True)
              for name,member in members.items():
                  prefix='usr/share/daed/web/'
                  if name.startswith(prefix) and member.isfile():
                      rel=Path(name[len(prefix):])
                      assert not rel.is_absolute() and '..' not in rel.parts
                      target=web/rel; target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(package.extractfile(member).read())
          assert (work/'web/index.html').is_file()
          print('Rust daed ARM64 ELF, geodata and UI extracted from the pinned package')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-daed-e5-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e5-linux/work/network-addons/daed
            e5-linux/work/network-addons/geoip.dat
            e5-linux/work/network-addons/geosite.dat
            e5-linux/work/network-addons/web/**
          if-no-files-found: error
  build:
    needs: [block-package, wifi-package, rust-engine]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    defaults:
      run:
        working-directory: e5-linux
    outputs:
      tag: ${{ steps.start.outputs.release_tag }}
      title: ${{ steps.verify.outputs.release_title }}
      source: ${{ steps.source.outputs.commit }}
    steps:
      # Pipeline errors must survive tee, otherwise validation reports a later
      # missing archive instead of the original build failure.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Quan-0505/e5-linux
          ref: ${{ inputs.source_ref || vars.E5_SOURCE_REF || 'main' }}
          path: e5-linux
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Check bootstrap configuration
        env:
          INPUTS_URL: https://github.com/sprd-linux-devs/e5-linux/releases/download/build-inputs/e5-ci-inputs.tar.gz
          INPUTS_SHA256: b9a67fecd5393da8fae58457d841a73105e664af19b5355f3c71d922400536d6
        run: |
          [[ "$INPUTS_URL" == https://* ]] || { echo '::error::Set E5_CI_INPUTS_URL to the HTTPS bootstrap archive URL (docs/RELEASE.md).'; exit 1; }
          [[ "$INPUTS_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo '::error::Set E5_CI_INPUTS_SHA256 to its SHA-256 (docs/RELEASE.md).'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sprd-linux-devs/linux
          ref: ${{ inputs.kernel_ref || vars.E5_KERNEL_REF || 'e5-6.18' }}
          path: e5-linux/linux-lts-e5
          fetch-depth: 128
          persist-credentials: false
      - name: Validate device repositories
        run: |
          python3 tools/prepare-screen-compat.py
          python3 tools/device-layout.py check --system openwrt --model e5
          python3 tools/tests/device-layout.py
      - name: Record sources and UTC+8 compile start
        id: start
        env:
          E5_CI_INPUTS_SHA256: b9a67fecd5393da8fae58457d841a73105e664af19b5355f3c71d922400536d6
          E5_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/ci-release.py prepare
      - name: Record e5-linux commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 e2fsprogs binutils python3 python3-venv libglib2.0-0t64 qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-x86_64
      - name: Restore and verify bootstrap inputs
        env:
          INPUTS_URL: https://github.com/sprd-linux-devs/e5-linux/releases/download/build-inputs/e5-ci-inputs.tar.gz
          INPUTS_SHA256: b9a67fecd5393da8fae58457d841a73105e664af19b5355f3c71d922400536d6
        run: |
          curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/ci-inputs.tar.gz" "$INPUTS_URL"
          python3 tools/ci-inputs.py restore "$RUNNER_TEMP/ci-inputs.tar.gz" --sha256 "$INPUTS_SHA256"
      - name: Check installer and audio logic
        run: |
          bash -n openwrt/make-flash-bundle.sh openwrt/build-rootfs.sh upstream/build.sh
          # The GPT and bounded-write tests need a disposable OpenWrt userspace.
          mkdir -p work/openwrt
          base="https://downloads.openwrt.org/releases/$E5_WRT_VER/targets/armsr/armv8"
          file="openwrt-$E5_WRT_VER-armsr-armv8-rootfs.tar.gz"
          curl -fsSL --retry 5 "$base/$file" -o "work/openwrt/$file"
          curl -fsSL --retry 5 "$base/sha256sums" -o work/openwrt/sha256sums
          checksum=$(awk -v file="$file" '$2 == "*" file || $2 == file { print $1 }' work/openwrt/sha256sums)
          [ -n "$checksum" ] || { echo '::error::No checksum for OpenWrt rootfs'; exit 1; }
          printf '%s  %s\n' "$checksum" "work/openwrt/$file" | sha256sum --check
          docker import --platform linux/arm64 "work/openwrt/$file" "e5-openwrt-base:$E5_WRT_VER"
          python3 tools/tests/android-bootchain.py
          python3 device/openwrt_device_common/tests/block-probe.py
          python3 openwrt/tests/userdata-size.py
          python3 openwrt/tests/flash-diagnostics.py
          E5_TEST_IMAGE="e5-openwrt-base:$E5_WRT_VER" python3 device/openwrt_device_common/tests/gpt-plan.py
          python3 device/openwrt_device_common/tests/voice-audio.py
          python3 device/openwrt_device_common/tests/dual-sms.py
          python3 device/openwrt_device_common/tests/sms-multipart.py
          python3 device/openwrt_device_common/tests/power-events.py
          python3 device/openwrt_device_common/tests/test_apn.py
          python3 device/openwrt_device_common/tests/modem-port-discovery.py
          python3 device/openwrt_device_common/tests/prepare-profiles.py
          python3 ci/infoscreen/tests/device/test_screen_apn.py
          python3 ci/infoscreen/tests/device/test_screen_session_startup.py
          node ci/infoscreen/tests/device/test_calls_transport.cjs
          python3 device/openwrt_device_common/tests/dual-sms-send.py
          python3 device/openwrt_device_common/tests/sim-probe.py
          E5_TEST_IMAGE="e5-openwrt-base:$E5_WRT_VER" python3 device/openwrt_device_common/tests/sim-lock.py
          node device/openwrt_device_common/tests/luci-sim-slots.cjs
          python3 magisk/tests.py
          python3 rootfs/tests/sd-registry.py
          python3 rootfs/tests/early-sd-firmware.py
          E5_TEST_IMAGE="e5-openwrt-base:$E5_WRT_VER" python3 rootfs/tests/sd-write.py
          python3 rootfs/tests/voice-state.py
          python3 rootfs/tests/modem-coldboot.py
          python3 tools/tests/ci-release.py
          python3 tools/tests/infoscreen-daed-app.py
          python3 tools/tests/infoscreen-daed-key0.py
          python3 tools/tests/openwrt-package-state.py
          python3 tools/tests/rootfs-inline-script.py
          python3 tools/tests/rootfs-apk-retry.py
          python3 openwrt/tests/part-root-boot.py
          python3 openwrt/tests/patch-hostapd-sae.py
          python3 boot/tests/part-install.py
          python3 boot/tests/part-update.py
          python3 tools/tests/network-addons-snapshot.py
          python3 ci/infoscreen-plugins/tools/check.py
          if [ -f ci/infoscreen/tests/network-checks.sh ]; then
            E5_TEST_IMAGE="e5-openwrt-base:$E5_WRT_VER" bash ci/infoscreen/tests/network-checks.sh
            python3 ci/infoscreen/tests/usb-reset.py
          fi
      - name: Build ARM64 toolchain container
        run: docker build -t e5-mainline-build upstream/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-daed-e5-${{ github.run_id }}-${{ github.run_attempt }}
          path: e5-linux/work/network-addons
      - name: Stage pinned Rust daed and public NodeBaby inputs
        run: |
          python3 tools/stage-network-addons.py --fetch
          python3 tools/tests/network-addons.py
      - name: Compile the release kernel
        env:
          E5_RELEASE: '1'
        run: bash upstream/build.sh
      - name: Restore patched OpenWrt packages
        id: packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            e5-linux/out/openwrt/*.apk
            e5-linux/out/openwrt/e5-modemmanager-build.json
          key: patched-apk-${{ runner.os }}-${{ runner.arch }}-${{ env.E5_WRT_VER }}-${{ hashFiles('e5-linux/tools/openwrt-package-state.py', 'e5-linux/device/openwrt_device_common/tests/voice-identity.py', 'e5-linux/device/openwrt_device_common/tests/sim-power.py', 'e5-linux/openwrt/build-modemmanager.sh', 'e5-linux/openwrt/build-bluez.sh', 'e5-linux/openwrt/patches/**', 'e5-linux/device/debian_device_common/patches/modemmanager-*.patch', 'e5-linux/device/debian_device_common/patches/bluez-*.patch') }}
      - name: Compile patched ModemManager and BlueZ
        if: steps.packages.outputs.cache-hit != 'true'
        run: |
          bash openwrt/build-modemmanager.sh
          bash openwrt/build-bluez.sh
          # This volume belongs to this ephemeral runner. Free it before image assembly.
          docker volume rm e5-openwrt-src
      - name: Save patched packages before image assembly
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            e5-linux/out/openwrt/*.apk
            e5-linux/out/openwrt/e5-modemmanager-build.json
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Download native SDK guarded block package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guarded-block-${{ github.run_id }}-${{ github.run_attempt }}
          path: e5-linux/out/openwrt
      - name: Build and test guarded block-mount
        run: |
          sh openwrt/build-block-mount.sh
          E5_TEST_IMAGE="e5-openwrt-base:$E5_WRT_VER" E5_TEST_BLOCK_APK="$PWD/out/openwrt/block-mount-guarded.apk" python3 device/openwrt_device_common/tests/block-probe.py
          docker run --rm -v "$PWD:/src:ro" "e5-openwrt-base:$E5_WRT_VER" sh -ec 'apk add -q ucode-mod-uci; ucode -L "/src/device/openwrt_device_common/luci-app-t551m/root/usr/libexec/unisoc-modem/*.uc" /src/device/openwrt_device_common/tests/apn.uc'
      - name: Validate screen and LuCI browser flows
        env:
          MU300_BROWSER_TESTS: '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-tests"
          "$RUNNER_TEMP/browser-tests/bin/pip" install playwright==1.60.0
          "$RUNNER_TEMP/browser-tests/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/browser-tests/bin/python" device/openwrt_device_common/tests/test_apn_browser.py
          "$RUNNER_TEMP/browser-tests/bin/python" ci/infoscreen/tests/device/test_screen_apn_browser.py
          "$RUNNER_TEMP/browser-tests/bin/python" device/openwrt_device_common/tests/screen-rpc.py
          "$RUNNER_TEMP/browser-tests/bin/python" ci/infoscreen/tests/device/test_screen_charger_wake.py --fixtures ci/infoscreen/tests/fixtures/browser-status.json --webroot ci/infoscreen/root/usr/share/e5-infoscreen/www
      - name: Download native Wi-Fi SAE packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wifi-sae-${{ github.run_id }}-${{ github.run_attempt }}
          path: e5-linux/work/wifi-sae
      - name: Verify transferred Wi-Fi SAE packages
        run: python3 openwrt/wifi-sae-state.py work/wifi-sae
      - name: Assemble the generic mainline flash bundles
        env:
          E5_MAINLINE: '1'
          E5_TOOLS_BUILD_IMAGE: e5-mainline-build
        run: |
          set -o pipefail
          export E5_INFOSCREEN="$GITHUB_WORKSPACE/e5-linux/ci/infoscreen"
          export E5_INFOSCREEN_PLUGINS="$GITHUB_WORKSPACE/e5-linux/ci/infoscreen-plugins"
          bash openwrt/make-flash-bundle.sh 2>&1 | tee out/release/bundle-build.log
      - name: Verify add-ons in the actual generated root filesystem
        run: python3 tools/stage-network-addons.py --verify-archive work/openwrt/e5-openwrt-$E5_WRT_VER-generic-rootfs.tar.gz
      - name: Package Android to Linux Magisk module
        run: bash magisk/build.sh
      - name: Validate release archives and sources
        id: verify
        run: python3 tools/ci-release.py verify
      - name: Upload validated release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flash-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e5-linux/out/release/*.tar.gz
            e5-linux/out/release/*.zip
            e5-linux/out/release/SHA256SUMS
            e5-linux/out/release/build.json
            e5-linux/out/release/release-notes.md
          compression-level: 0
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e5-linux/out/release/*.log
            e5-linux/out/release/build.json
            e5-linux/upstream/out-release/config
          if-no-files-found: ignore

  windows-installer:
    needs: build
    uses: ./.github/workflows/gui.yml
    with:
      source_ref: ${{ needs.build.outputs.source }}

  publish:
    needs: [build, windows-installer]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.source }}
          path: installer-source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flash-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openwrt-installer-windows
          path: installer-artifact
      - name: Verify and package the portable Windows installer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, sys, zipfile
          from pathlib import Path, PurePosixPath
          sys.path.insert(0, 'installer-source/installer')
          from package_gui import digest, sources
          root = Path('installer-artifact').resolve()
          meta = json.loads((root / 'build.json').read_text(encoding='utf-8'))
          if meta.get('source') != sources():
              raise SystemExit('Windows installer source fingerprint does not match the firmware source commit')
          for name, wanted in meta.get('files', {}).items():
              rel = PurePosixPath(name)
              path = (root / Path(*rel.parts)).resolve()
              if rel.is_absolute() or '..' in rel.parts or not path.is_relative_to(root) or digest(path) != wanted:
                  raise SystemExit(f'Windows installer artifact failed its manifest check: {name}')
          if not (root / 'OpenWrt-Installer.exe').is_file():
              raise SystemExit('Windows installer executable is missing')
          target = Path('release/e5-openwrt-installer-windows.zip')
          with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          print('Windows installer ZIP SHA-256:', digest(target))
          PY
          installer_sha="$(sha256sum release/e5-openwrt-installer-windows.zip | cut -d' ' -f1)"
          {
            cat release/release-notes.md
            printf '\n\n## Windows portable installer\n\n'
            printf '%s\n' 'Download `e5-openwrt-installer-windows.zip` for the standalone Windows GUI installer. Extract it and run `OpenWrt-Installer.exe`, keeping the adjacent `tools/` directory. This ZIP does not include firmware; use it with the complete E5 firmware package.'
            printf '\n\nInstaller SHA-256: `%s`\n' "$installer_sha"
          } > release/release-notes.updated.md
          mv release/release-notes.updated.md release/release-notes.md
      - name: Publish validated files through a draft release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTO_TAG: ${{ needs.build.outputs.tag }}
          TITLE: ${{ needs.build.outputs.title }}
          SOURCE: ${{ needs.build.outputs.source }}
          RELEASE_COMMIT: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          sha256sum --check SHA256SUMS
          tag="$AUTO_TAG"
          if [ "$EVENT" = push ]; then tag="$REF_NAME"; fi
          # Refuse to replace a published release; failed uploads may leave a draft.
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ] || { echo '::error::Release already published; use a new tag or a manual build.'; exit 1; }
          else
            gh release create "$tag" --target "$RELEASE_COMMIT" --title "$TITLE" --notes-file release-notes.md --draft
          fi
          gh release upload "$tag" ./*.zip --clobber
          args=(--draft=false --title "$TITLE" --notes-file release-notes.md)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); else args+=(--prerelease=false --latest); fi
          gh release edit "$tag" "${args[@]}"
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
