name: Build and publish OpenWrt
run-name: OpenWrt ${{ inputs.openwrt_version || '25.12.5' }} · ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt release
        default: '25.12.5'
        required: true
      kernel_ref:
        description: linux-lts-e5 branch, tag or commit
        default: e5-6.18
        required: true
      infoscreen_ref:
        description: infoscreen branch, tag or commit
        default: main
        required: true
      plugins_ref:
        description: infoscreen-plugins branch, tag or commit
        default: main
        required: true
      publish:
        description: Publish a GitHub Release after validation
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flash-release-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: CST-8
  E5_WRT_VER: ${{ inputs.openwrt_version || '25.12.5' }}

jobs:
  block-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: out/openwrt/block-mount-guarded.apk*
          key: guarded-block-native-${{ env.E5_WRT_VER }}-${{ hashFiles('openwrt/build-block-mount*.sh', 'openwrt/block-mount.Dockerfile', 'openwrt/block-probe-guard.h', 'openwrt/patches/fstools-probe-device-types.patch') }}
      - name: Build guarded block package using native x86 SDK
        run: sh openwrt/build-block-mount.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guarded-block-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/openwrt/block-mount-guarded.apk*
          if-no-files-found: error
  build:
    needs: block-package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      tag: ${{ steps.start.outputs.release_tag }}
      title: ${{ steps.verify.outputs.release_title }}
      source: ${{ steps.source.outputs.commit }}
    steps:
      # Pipeline errors must survive tee, otherwise validation reports a later
      # missing archive instead of the original build failure.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check bootstrap configuration
        env:
          INPUTS_URL: https://github.com/sprd-linux-devs/e5-linux/releases/download/build-inputs/e5-ci-inputs.tar.gz
          INPUTS_SHA256: b9a67fecd5393da8fae58457d841a73105e664af19b5355f3c71d922400536d6
        run: |
          [[ "$INPUTS_URL" == https://* ]] || { echo '::error::Set E5_CI_INPUTS_URL to the HTTPS bootstrap archive URL (docs/RELEASE.md).'; exit 1; }
          [[ "$INPUTS_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo '::error::Set E5_CI_INPUTS_SHA256 to its SHA-256 (docs/RELEASE.md).'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sprd-linux-devs/linux
          ref: ${{ inputs.kernel_ref || vars.E5_KERNEL_REF || 'e5-6.18' }}
          path: linux-lts-e5
          fetch-depth: 128
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Enceka/infoscreen
          ref: 09b7ec822e56062f1891136c78860d5e257493c6
          path: ci/infoscreen
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Enceka/infoscreen-plugins
          ref: dc052472787d14e7f24a28bc9cf1cd0cee13fa69
          path: ci/infoscreen-plugins
          persist-credentials: false
      - name: Record sources and UTC+8 compile start
        id: start
        env:
          E5_CI_INPUTS_SHA256: b9a67fecd5393da8fae58457d841a73105e664af19b5355f3c71d922400536d6
          E5_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/ci-release.py prepare
      - name: Record e5-linux commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 e2fsprogs binutils python3 qemu-user-static binfmt-support
          # The checksum-pinned OpenWrt SDK is x86_64; the runner is ARM64.
          sudo update-binfmts --enable qemu-x86_64
      - name: Restore and verify bootstrap inputs
        env:
          INPUTS_URL: https://github.com/sprd-linux-devs/e5-linux/releases/download/build-inputs/e5-ci-inputs.tar.gz
          INPUTS_SHA256: b9a67fecd5393da8fae58457d841a73105e664af19b5355f3c71d922400536d6
        run: |
          curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/ci-inputs.tar.gz" "$INPUTS_URL"
          python3 tools/ci-inputs.py restore "$RUNNER_TEMP/ci-inputs.tar.gz" --sha256 "$INPUTS_SHA256"
      - name: Prepare pinned screen compatibility
        run: python3 tools/prepare-screen-compat.py
      - name: Check installer and audio logic
        run: |
          python3 devices/test_emmc_dma.py linux-lts-e5
          bash -n openwrt/make-flash-bundle.sh openwrt/build-rootfs.sh upstream/build.sh
          # The GPT and bounded-write tests need a disposable OpenWrt userspace.
          mkdir -p work/openwrt
          base="https://downloads.openwrt.org/releases/$E5_WRT_VER/targets/armsr/armv8"
          file="openwrt-$E5_WRT_VER-armsr-armv8-rootfs.tar.gz"
          curl -fsSL --retry 5 "$base/$file" -o "work/openwrt/$file"
          curl -fsSL --retry 5 "$base/sha256sums" -o work/openwrt/sha256sums
          checksum=$(awk -v file="$file" '$2 == "*" file || $2 == file { print $1 }' work/openwrt/sha256sums)
          [ -n "$checksum" ] || { echo '::error::No checksum for OpenWrt rootfs'; exit 1; }
          printf '%s  %s\n' "$checksum" "work/openwrt/$file" | sha256sum --check
          docker import --platform linux/arm64 "work/openwrt/$file" "e5-openwrt-base:$E5_WRT_VER"
          python3 boot/tests/part-update.py
          python3 openwrt/tests/flash-diagnostics.py
          python3 tools/tests/network-addons-snapshot.py
          python3 openwrt/tests/install-entrypoints.py
          python3 openwrt/tests/hybrid-package.py
            python3 devices/test_upstream_20261014.py
          python3 tools/tests/android-bootchain.py
          python3 openwrt/tests/block-probe.py
          E5_TEST_IMAGE="e5-openwrt-base:$E5_WRT_VER" python3 openwrt/tests/gpt-plan.py
          python3 openwrt/tests/voice-audio.py
          python3 openwrt/tests/dual-sms.py
          python3 openwrt/tests/dual-sms-send.py
          python3 openwrt/tests/sim-probe.py
          E5_TEST_IMAGE="e5-openwrt-base:$E5_WRT_VER" python3 openwrt/tests/sim-lock.py
          node openwrt/tests/luci-sim-slots.cjs
          python3 magisk/tests.py
          python3 rootfs/tests/sd-registry.py
          python3 rootfs/tests/early-sd-firmware.py
          E5_TEST_IMAGE="e5-openwrt-base:$E5_WRT_VER" python3 rootfs/tests/sd-write.py
          python3 rootfs/tests/voice-state.py
          python3 rootfs/tests/modem-coldboot.py
          python3 tools/tests/ci-release.py
          python3 tools/tests/openwrt-package-state.py
          python3 ci/infoscreen-plugins/tools/check.py
          if [ -f ci/infoscreen/tests/network-checks.sh ]; then
            E5_TEST_IMAGE="e5-openwrt-base:$E5_WRT_VER" bash ci/infoscreen/tests/network-checks.sh
            python3 ci/infoscreen/tests/usb-reset.py
          fi
      - name: Build ARM64 toolchain container
        run: docker build -t e5-mainline-build upstream/
      - uses: actions/checkout@v4
        with:
          repository: Quan-0505/daed-kdae
          ref: 92aa565ae2d8de920380d1cca0872f4780b9c316
          path: kdae-source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Download checksum-pinned NodeBaby from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/network-addons
          gh release download build-inputs --repo "$GITHUB_REPOSITORY" \
            --pattern owjdxb_openwrt_arm64_4.3.5-734.tgz --output work/network-addons/nodebaby.tgz
          echo 'c2c1853eac004ae3699a8f3beba3331afc42aca1878acd2c7945a5658deea702  work/network-addons/nodebaby.tgz' | sha256sum --check
      - name: Build pinned Go KDAE and stage public NodeBaby inputs
        run: |
          sudo apt-get install -y clang llvm libelf-dev
          cd "$GITHUB_WORKSPACE/kdae-source"
          pnpm --dir console install --frozen-lockfile
          npm run build
          python3 -m unittest discover -s backend/tests -p 'test_*.py'
          python3 backend/prepare-wing.py "$RUNNER_TEMP/kdae-wing" --clone
          cd "$RUNNER_TEMP/kdae-wing"
          make deps
          go test ./dae ./maintenance ./observability ./consoleapi ./graphql ./graphql/service/subscription
          mkdir -p "$GITHUB_WORKSPACE/work/network-addons"
          CGO_ENABLED=0 make OUTPUT="$GITHUB_WORKSPACE/work/network-addons/daed" APPNAME=daed WEB_DIST="$GITHUB_WORKSPACE/kdae-source/dist" VERSION=v2.2.5-kdae bundle
          cd "$GITHUB_WORKSPACE"
          python3 tools/stage-network-addons.py --fetch
          python3 tools/tests/network-addons.py
      - name: Fingerprint native kernel sources and toolchain
        id: kernel-key
        run: |
          fingerprint=$(docker run --rm e5-mainline-build sh -ec 'clang --version; ld.lld --version; pahole --version' | sha256sum | cut -d ' ' -f 1)
          revision=$(git -C linux-lts-e5 rev-parse HEAD)
          # Only tracked source objects count: test-generated Python bytecode
          # contains timestamps and otherwise causes a cache miss every run.
          source_fingerprint=$(git ls-files -s -- 'upstream/*.config' 'upstream/*.txt' 'upstream/*.py' upstream/Dockerfile devices/ | sha256sum | cut -d ' ' -f 1)
          echo "key=e5-native-profile-v2-${{ runner.arch }}-$revision-$fingerprint-$source_fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore verified native E5 kernel
        id: kernel-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: upstream/out-release
          key: ${{ steps.kernel-key.outputs.key }}
      - name: Compile the release kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        env:
          E5_RELEASE: '1'
        run: |
          docker run --rm -v "$PWD":/work -v "$PWD/linux-lts-e5":/src/linux \
            -v e5-profile-objects:/objects -w /work \
            -e E5_KERNEL_TREE=/src/linux -e E5_OUTDIR=/objects \
            -e E5_FEATURE_OUT=/work/upstream/out-release \
            -e JOBS="$(nproc)" e5-mainline-build bash devices/e5/build-kernel.sh
          sudo chown -R "$(id -u):$(id -g)" upstream/out-release
          printf '%s\n' "$E5_BUILD_EPOCH" > upstream/out-release/compile-epoch
      - name: Verify compiled or cached native E5 kernel
        run: |
          test "$(cat upstream/out-release/source-commit)" = "$(git -C linux-lts-e5 rev-parse HEAD)"
          python3 upstream/check-container-support.py upstream/out-release
      - name: Save verified native E5 kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: upstream/out-release
          key: ${{ steps.kernel-key.outputs.key }}
      - name: Restore patched OpenWrt packages
        id: packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            out/openwrt/*.apk
            out/openwrt/e5-modemmanager-build.json
          key: patched-apk-${{ runner.os }}-${{ runner.arch }}-${{ env.E5_WRT_VER }}-${{ hashFiles('tools/openwrt-package-state.py', 'openwrt/tests/voice-identity.py', 'openwrt/tests/sim-power.py', 'openwrt/build-modemmanager.sh', 'openwrt/build-bluez.sh', 'openwrt/patches/**', 'rootfs/deb-patches/modemmanager-*.patch', 'rootfs/deb-patches/bluez-*.patch') }}
      - name: Compile patched ModemManager and BlueZ
        if: steps.packages.outputs.cache-hit != 'true'
        run: |
          bash openwrt/build-modemmanager.sh
          bash openwrt/build-bluez.sh
          # This volume belongs to this ephemeral runner. Free it before image assembly.
          docker volume rm e5-openwrt-src
      - name: Save patched packages before image assembly
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            out/openwrt/*.apk
            out/openwrt/e5-modemmanager-build.json
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Restore native guarded block package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: guarded-block-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/openwrt
      - name: Build and test guarded block-mount
        run: |
          E5_TEST_IMAGE="e5-openwrt-base:$E5_WRT_VER" E5_TEST_BLOCK_APK="$PWD/out/openwrt/block-mount-guarded.apk" python3 openwrt/tests/block-probe.py
      - name: Assemble the generic mainline flash bundles
        env:
          E5_MAINLINE: '1'
          E5_TOOLS_BUILD_IMAGE: e5-mainline-build
          E5_FEATURES: '1'
          T551M_CC: gcc
        run: |
          set -o pipefail
          export E5_INFOSCREEN="$GITHUB_WORKSPACE/ci/infoscreen"
          export E5_INFOSCREEN_PLUGINS="$GITHUB_WORKSPACE/ci/infoscreen-plugins"
          bash openwrt/make-flash-bundle.sh 2>&1 | tee out/release/bundle-build.log
      - name: Verify actual KDAE and NodeBaby rootfs contents
        run: python3 tools/stage-network-addons.py --verify-archive work/openwrt/e5-openwrt-$E5_WRT_VER-generic-rootfs.tar.gz
      - name: Package Android to Linux Magisk module
        run: bash magisk/build.sh
      - name: Validate release archives and sources
        id: verify
        run: python3 tools/ci-release.py verify
      - name: Upload validated release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flash-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/release/*.tar.gz
            out/release/*.zip
            out/release/SHA256SUMS
            out/release/build.json
            out/release/release-notes.md
          compression-level: 0
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/release/*.log
            out/release/build.json
            upstream/out-release/config
          if-no-files-found: ignore

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flash-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Publish validated files through a draft release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTO_TAG: ${{ needs.build.outputs.tag }}
          TITLE: ${{ needs.build.outputs.title }}
          SOURCE: ${{ needs.build.outputs.source }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          sha256sum --check SHA256SUMS
          tag="$AUTO_TAG"
          if [ "$EVENT" = push ]; then tag="$REF_NAME"; fi
          # Refuse to replace a published release; failed uploads may leave a draft.
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ] || { echo '::error::Release already published; use a new tag or a manual build.'; exit 1; }
          else
            gh release create "$tag" --target "$SOURCE" --title "$TITLE" --notes-file release-notes.md --draft
          fi
          gh release upload "$tag" ./*.tar.gz ./*.zip SHA256SUMS build.json --clobber
          args=(--draft=false --title "$TITLE" --notes-file release-notes.md)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); else args+=(--prerelease=false --latest); fi
          gh release edit "$tag" "${args[@]}"
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
